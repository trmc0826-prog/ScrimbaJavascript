<html>
  <head>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div>
        <!------------------- home team ---------------------->
        <h3>HOME</h3>
        <div class="score" id="home-score">0</div>
        <div class="buttons">
          <button onclick="changeScore('home', 1)">+1</button>
          <button onclick="changeScore('home', 2)">+2</button>
          <button onclick="changeScore('home', 3)">+3</button>
        </div>
      </div>
      <div>
        <!------------------- away team ---------------------->
        <h3>away</h3>
        <div class="score" id="away-score">0</div>
        <div class="buttons">
          <button onclick="changeScore('away', 1)">+1</button>
          <button onclick="changeScore('away', 2)">+2</button>
          <button onclick="changeScore('away', 3)">+3</button>
        </div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
  <div class="reset-wrapper">
    <button onclick="resetAll()">Reset both scores</button>
  </div>
</html>
